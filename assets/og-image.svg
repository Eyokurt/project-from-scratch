<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg { fill: #151619; }
      .border { stroke: #26272D; stroke-width: 1; fill: none; }
      .corner { stroke: #52525B; stroke-width: 2; fill: none; }
      .badge-bg { fill: #1C1D22; stroke: #2E2F38; stroke-width: 1; }
      .badge-text { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #93C5FD; font-weight: 600; letter-spacing: 1px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 56px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 400; fill: #A1A1AA; }
      .divider { stroke: #26272D; stroke-width: 1; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; fill: #71717A; }
      .step-box { fill: #18191D; stroke: #2A2B33; stroke-width: 1; }
      .step-text { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #D4D4D8; }
      .arrow { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #52525B; }
      .footer-text { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #71717A; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" class="bg" />

  <!-- Outer Border Frame -->
  <rect x="28" y="28" width="1144" height="574" class="border" />

  <!-- Corner Accents -->
  <path d="M 28 40 L 28 28 L 40 28" class="corner" />
  <path d="M 1160 28 L 1172 28 L 1172 40" class="corner" />
  <path d="M 28 590 L 28 602 L 40 602" class="corner" />
  <path d="M 1160 602 L 1172 602 L 1172 590" class="corner" />

  <!-- Top Badge -->
  <rect x="80" y="84" width="370" height="32" rx="4" class="badge-bg" />
  <text x="94" y="105" class="badge-text">ANTIGRAVITY SKILL  |  SPEC-DRIVEN ARCHITECTURE</text>

  <!-- Main Title -->
  <text x="80" y="210" class="title">project-from-scratch</text>

  <!-- Subtitle -->
  <text x="80" y="265" class="subtitle">Adaptive Project Discovery &amp; Specification Engine</text>

  <!-- Divider Line -->
  <line x1="80" y1="305" x2="1120" y2="305" class="divider" />

  <!-- Core Tagline -->
  <text x="80" y="350" class="tagline">Conducts calibrated socratic interviews to solidify software concepts into formal specifications before any code is written.</text>

  <!-- Architectural Flow Steps -->
  <g transform="translate(80, 405)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="175" height="44" rx="3" class="step-box" />
    <text x="40" y="27" class="step-text">01  REFLECT</text>
    <text x="187" y="27" class="arrow">-&gt;</text>

    <!-- Box 2 -->
    <rect x="215" y="0" width="175" height="44" rx="3" class="step-box" />
    <text x="245" y="27" class="step-text">02  CALIBRATE</text>
    <text x="402" y="27" class="arrow">-&gt;</text>

    <!-- Box 3 -->
    <rect x="430" y="0" width="175" height="44" rx="3" class="step-box" />
    <text x="466" y="27" class="step-text">03  DISCOVER</text>
    <text x="617" y="27" class="arrow">-&gt;</text>

    <!-- Box 4 -->
    <rect x="645" y="0" width="175" height="44" rx="3" class="step-box" />
    <text x="668" y="27" class="step-text">04  PRE-MORTEM</text>
    <text x="832" y="27" class="arrow">-&gt;</text>

    <!-- Box 5 -->
    <rect x="860" y="0" width="175" height="44" rx="3" class="step-box" />
    <text x="906" y="27" class="step-text">05  SPECIFY</text>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="520" x2="1120" y2="520" class="divider" />

  <!-- Footer Metadata -->
  <text x="80" y="555" class="footer-text">github.com/Eyokurt/project-from-scratch</text>
  <text x="680" y="555" class="footer-text">ZERO CODE  |  ADR DECISION LOG  |  5 MATURITY GATES</text>
</svg>
